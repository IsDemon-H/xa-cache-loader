[package]
name = "xa-cache-loader"
version = "1.0.0"
edition = "2024"
description = "Xa缓存加载工具"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
zip = "2"
sevenz-rust = "0.6"
dirs = "6"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
