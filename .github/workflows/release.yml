name: Build and Sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Microsoft Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE_NAME }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/xa-cache-loader.exe
          name: "Xa缓存加载工具 ${{ github.ref_name }}"
          body: |
            ## Xa缓存加载工具 ${{ github.ref_name }}

            ✅ 已通过 Microsoft 信任签名免费签名，SmartScreen 不会拦截。

            ### 使用方法
            1. 下载 `xa-cache-loader.exe`
            2. 放置到目标目录
            3. 同目录下放置 `Xa缓存.zip`（可选）
            4. 运行程序，点击"加载"

            > 由 Microsoft Trusted Signing (Community 免费层) 提供代码签名

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xa-cache-loader-signed
          path: target/release/xa-cache-loader.exe
