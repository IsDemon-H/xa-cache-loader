name: Build and Sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Generate self-signed code signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=XaCacheLoader" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $cert | Export-Certificate -FilePath cert.cer -Type CERT
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Sign executable
        shell: powershell
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          $out = "target\release\xa-cache-loader.exe"
          Set-AuthenticodeSignature -FilePath $out -Certificate $cert -TimestampServer "http://timestamp.digicert.com"

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/xa-cache-loader.exe
          name: "Xa缓存加载工具 ${{ github.ref_name }}"
          body: |
            ## Xa缓存加载工具 ${{ github.ref_name }}

            ### 使用方法
            1. 下载 `xa-cache-loader.exe`
            2. 放置到目标目录
            3. 同目录下放置 `Xa缓存.zip`（可选）
            4. 运行程序，点击"加载"

            > ⚠️ 首次运行 SmartScreen 可能会警告，点"更多信息"→"仍要运行"即可。
            > 可以使用免费代码签名证书后更新此工作流。

      - name: Upload artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xa-cache-loader-signed
          path: target/release/xa-cache-loader.exe
